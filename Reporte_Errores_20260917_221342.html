<!DOCTYPE html>
<html>
<head>
<title>Reporte de Errores</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 40px; color: #333; }
h2 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; display: inline-block; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; background-color: #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
th { background-color: #2c3e50; color: #ffffff; text-transform: uppercase; font-size: 0.9em; letter-spacing: 0.5px; }
tr:hover { background-color: #f9f9f9; }
.etiqueta { padding: 5px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 0.85em; text-align: center; display: inline-block; }
.resumen { background-color: #fff; padding: 20px; border-left: 5px solid #27ae60; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 4px; margin-bottom: 20px; font-size: 1.1em; }
</style>
<style>th { background-color: #e74c3c; }</style>
</head>
<body>
<h2>Reporte de Errores Léxicos</h2>
<div class="resumen" style="border-left-color: #3498db;"><strong>¡Excelente!</strong> No se encontraron errores léxicos en el código analizado.</div>
</body>
</html>
